# ---------------------------------------------------------------------------
# GitHub Actions CI for Go projects
# ---------------------------------------------------------------------------
# Runs on push/PR to main. Pipeline:
#   tidy → build → vet → lint → test (short, race) → deadcode → vulncheck
#   → documentation checks
#   → cross-compile linux/amd64 → upload artifact (push to main only)
#
# Optimized for minimal CI minutes:
#   - concurrency cancels superseded runs
#   - dev tools (deadcode/govulncheck/golangci-lint) are cached across runs
#     instead of recompiled from source every time
#   - cross-compile + artifact upload run only on push to main, not on PRs
#   - a job timeout caps runaway spend
# ---------------------------------------------------------------------------

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  GO_VERSION: "1.26.5"
  GO_TOOLS_VERSION: "v0.45.0"
  GOVULNCHECK_VERSION: "v1.3.0"
  GOLANGCI_LINT_VERSION: "v2.12.2"

permissions:
  contents: read

concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  ci:
    name: "Go CI"
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 2

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: "${{ env.GO_VERSION }}"
          cache: true
          cache-dependency-path: go.sum

      - name: Set up protoc
        uses: arduino/setup-protoc@v3
        with:
          version: "35.1"

      # Cache the compiled tool binaries keyed on their pinned versions, so we
      # only pay to build them on the first run (or when a version changes).
      # This is the biggest per-run saving: golangci-lint in particular is slow
      # to compile from source.
      - name: Cache dev tools
        id: cache-tools
        uses: actions/cache@v4
        with:
          path: ~/go/bin
          key: go-tools-${{ runner.os }}-${{ env.GO_VERSION }}-${{ env.GO_TOOLS_VERSION }}-${{ env.GOVULNCHECK_VERSION }}-${{ env.GOLANGCI_LINT_VERSION }}

      - name: Install dev tools
        if: steps.cache-tools.outputs.cache-hit != 'true'
        run: |
          go install golang.org/x/tools/cmd/deadcode@${GO_TOOLS_VERSION}
          go install golang.org/x/vuln/cmd/govulncheck@${GOVULNCHECK_VERSION}
          go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@${GOLANGCI_LINT_VERSION}

      - name: CI check
        run: make ci-check

      # Build + publish the release binary only when landing on main. PRs get
      # full correctness coverage from `make ci-check` above; a per-PR
      # cross-compile and artifact upload adds minutes and storage for no gain.
      - name: Cross-compile linux/amd64
        if: github.event_name == 'push'
        run: make cross-compile

      - name: Upload linux/amd64 artifact
        if: github.event_name == 'push' && hashFiles('bin/*-linux-amd64') != ''
        uses: actions/upload-artifact@v7
        with:
          name: binary-linux-amd64
          path: bin/*-linux-amd64
          retention-days: 3
          if-no-files-found: warn
