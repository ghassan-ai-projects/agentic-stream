<svg xmlns="http://www.w3.org/2000/svg" width="960" height="300" viewBox="0 0 960 300" role="img" aria-labelledby="title desc">
  <title id="title">From evidence to a governed outcome</title>
  <desc id="desc">Four stages: evidence builds a Situation, a useful change may start a bounded episode, and a permitted proposal enters governed action. Not every event or proposal advances to the next stage.</desc>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M 0 1 L 9 5 L 0 9" fill="none" stroke="#526174" stroke-width="1.5"/></marker></defs>
  <rect width="960" height="300" fill="#fafaf8"/>
  <g font-family="Arial, Helvetica, sans-serif" fill="#172638">
    <text x="24" y="38" font-size="23" font-weight="700">From evidence to a governed outcome</text>
    <text x="24" y="68" font-size="18" fill="#475569">Keep track of the condition. Reason when useful. Act when permitted.</text>
    <g fill="#ffffff" stroke="#a5afba" stroke-width="1.4">
      <rect x="24" y="102" width="204" height="148" rx="5"/>
      <rect x="260" y="102" width="204" height="148" rx="5"/>
      <rect x="496" y="102" width="204" height="148" rx="5"/>
      <rect x="732" y="102" width="204" height="148" rx="5"/>
    </g>
    <g stroke="#526174" stroke-width="2" marker-end="url(#arrow)">
      <path d="M 230 175 H 253"/><path d="M 466 175 H 489"/><path d="M 702 175 H 725"/>
    </g>
    <g font-size="23" font-weight="700">
      <text x="42" y="143">Evidence</text><text x="278" y="143">Situation</text>
      <text x="514" y="143">Episode</text><text x="750" y="143">Action</text>
    </g>
    <g font-size="20" fill="#334155">
      <text x="42" y="180">What happened?</text><text x="42" y="212">Sensor observations</text>
      <text x="278" y="180">What is changing?</text><text x="278" y="212">Versioned state</text>
      <text x="514" y="180">What next?</text><text x="514" y="212">Bounded proposal</text>
      <text x="750" y="180">May it execute?</text><text x="750" y="212">Checked outcome</text>
    </g>
    <text x="24" y="280" font-size="18" fill="#475569">Every transition has a gate. A proposal does not grant authority.</text>
  </g>
</svg>
