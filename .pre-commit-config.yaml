# ---------------------------------------------------------------------------
# Pre-commit hooks for Go projects
# ---------------------------------------------------------------------------
# Install once:  pre-commit install
# Run manually:  pre-commit run --all-files
#
# The `-local` flag below groups this module's imports first. Its value must
# match the module path declared in go.mod. pre-commit cannot interpolate it,
# so TestModulePathSingleSourceOfTruth (module_path_test.go) pins the copy.
# ---------------------------------------------------------------------------

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-merge-conflict
      - id: check-added-large-files
        args: ["--maxkb=1024"]
      - id: check-case-conflict
      - id: mixed-line-ending
        args: ["--fix=lf"]

  - repo: https://github.com/dnephin/pre-commit-golang
    rev: v0.5.1
    hooks:
      - id: go-fmt
      - id: go-imports
        # Generated imports are owned by the pinned protobuf generator.
        exclude: '(^|/).*\.pb\.go$'
        args: [-local, github.com/ghassan-ai-projects/agentic-stream]

  - repo: local
    hooks:
      - id: go-vet
        name: go vet
        entry: go vet ./...
        language: system
        types: [go]
        pass_filenames: false
      - id: golangci-lint
        name: golangci-lint
        entry: golangci-lint run --timeout=1m
        language: system
        types: [go]
        pass_filenames: false
