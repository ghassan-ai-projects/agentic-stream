      policy: approval
      rateLimitPerHour: 2
    - type: isolate_drive
      risk: R2
      description: Stop the degraded drive by plan on an empty belt; the survivors carry the belt.
      parameterSchema:
        type: object
        properties:
          entity_id:
            type: string
          situation_id:
            type: string
          situation_version:
