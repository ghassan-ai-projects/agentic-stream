cognition:
  triggers:
    - name: lost_reading_needs_its_report
      when: >
        situation.phase == "watch" &&
        (cel.bind(stuck_range_mm_s, 0.005,
        cel.bind(moving_range_mm_s, 0.02,
        cel.bind(drive_running_amps, 1.0,
        cel.bind(vibration_readings_15m, 14.0,
          features.drive3_amps > drive_running_amps &&
          features.drive1_vibration_readings_15m >= vibration_readings_15m && features.drive2_vibration_readings_15m >= vibration_readings_15m && features.drive3_vibration_readings_15m >= vibration_readings_15m &&
          features.drive3_vibration_max_15m - features.drive3_vibration_min_15m < stuck_range_mm_s &&
          features.drive1_vibration_max_15m - features.drive1_vibration_min_15m >= moving_range_mm_s &&
          features.drive2_vibration_max_15m - features.drive2_vibration_min_15m >= moving_range_mm_s)))) ||
          features.input_stale.drive1_vibration || features.input_stale.drive2_vibration || features.input_stale.drive3_vibration)
      score: double(situation.severity) * 0.5 + double(delta.novelty) * 25.0
      threshold: 20
      lane: fast
      completeness: any
      debounce: 100ms
      cooldown: 1m
      expiresAfter: 10m
      materialDelta: delta.phase_changed || delta.reasoning_failed
    - name: degraded_drive_needs_relief
      when: situation.phase == "degrading"
      score: double(situation.severity) * 0.5 + double(delta.novelty) * 25.0
      threshold: 20
      lane: deep
      completeness: any
      debounce: 100ms
      cooldown: 1m
      expiresAfter: 10m
      materialDelta: delta.phase_changed || delta.watch_fired || delta.reasoning_failed
    - name: shed_line_needs_emptying
      when: situation.phase == "shedding"
      score: double(situation.severity) * 0.5 + double(delta.novelty) * 25.0
      threshold: 20
      lane: fast
      completeness: any
      debounce: 100ms
      cooldown: 1m
      expiresAfter: 10m
      materialDelta: delta.phase_changed || delta.watch_fired || delta.reasoning_failed
    - name: known_cause_needs_its_planned_stop
      when: situation.phase in ["cause_bearing", "cause_gearbox", "cause_undecided"]
      score: double(situation.severity) * 0.5 + double(delta.novelty) * 25.0
      threshold: 20
      lane: fast
      completeness: any
      debounce: 100ms
      cooldown: 1m
      expiresAfter: 10m
      materialDelta: delta.phase_changed || delta.reasoning_failed
    - name: isolated_line_needs_its_feed
      when: situation.phase == "isolated"
      score: double(situation.severity) * 0.5 + double(delta.novelty) * 25.0
      threshold: 20
      lane: fast
      completeness: any
      debounce: 100ms
      cooldown: 1m
      expiresAfter: 10m
      materialDelta: delta.phase_changed || delta.reasoning_failed
  retryFailedReasoning:
    after: 6m
    max: 2
  executor:
    name: tamoz
    dispatchPolicy: active
    riskCeiling: R2
    objective: |
      One conveyor drive degrades against its peers at equal current. Give the
      diagnosis by the catalog's rules and request the one step of the
      situation's phase. drive_degrading is the diagnosis of a drive that
      degrades while neither the bearing rule nor the gearbox rule holds; bearing
      and gearbox_seizing refine it once their rule holds. The phase, not the
      cause, decides the step: an untold cause is no reason to wait, and a watch
      never replaces the step of a phase that has one. Never act on a rise every
      drive shares.
      - phase degrading: shed the feed to the plant's limp feed - intent
        reduce_feed (preset limp), with the diagnosis drive_degrading, or the
        cause when its rule already holds.
      - phase shedding: run the belt empty by stopping the feeder - intent
        stop_feed (preset empty), with the diagnosis drive_degrading, or the
        cause when its rule already holds. Do not shed the feed again.
      - phase watch: no step. When D-3's vibration reading is stuck (its
        15 minute readings all within 0.005 mm/s while each peer's move by at
        least 0.02 mm/s), give the diagnosis sensor_stuck: the vibration rules
        cannot be read while it lasts. When D-3's vibration reading stopped
        arriving (the fact input_stale.drive3_vibration is true), give the
        diagnosis sensor_lost.
      - phase belt_empty: no step; the evidence has not named the cause yet.
      - phase cause_bearing: stop the degraded drive by plan - intent
        isolate_drive (preset planned_stop).
      - phase cause_gearbox: stop the empty belt before the gearbox seizes -
        intent stop_belt (preset planned_stop).
      - phase cause_undecided: stop the empty belt, the safe default - intent
        stop_belt (preset planned_stop).
      - phase isolated: restore the plant's limp feed - intent reduce_feed
        (preset limp). The drive was isolated because its bearing rule held:
        give the diagnosis bearing, although the stopped drive no longer
        vibrates.
    prompt: >
      Analyze the immutable snapshot (each drive's current, its vibration and
      winding temperature over 15 minutes, the degraded drive's winding slope,
      the feed, its setpoint and the belt speed) and return a typed decision
      with a diagnosis and at most one request for the phase's step.
    modelPolicy: conveyor_reasoner
    promptVersion: drive-degradation-v1
    decisionSchema: schemas/maintenance-decision-v1.json
    tools:
      - features_query
      - evidence_get
    budget:
      wallTime: 30s
      modelCalls: 3
      inputTokens: 16000
      outputTokens: 2000
      toolCalls: 4
      toolResultBytes: 32768
      totalToolResultBytes: 65536
      providerRetries: 1
      costMicrounits: 400000
    diagnosisCatalog: '[{"code":"unknown","description":"no confident diagnosis"},{"code":"drive_degrading","description":"a drive degrades against its peers at equal current (winding or vibration residual); the cause is not told yet: neither the bearing rule nor the gearbox rule holds. bearing and gearbox_seizing refine it"},{"code":"bearing","description":"a dry drive bearing: the drive''s 15 minute vibration mean is at least 0.3 mm/s above the larger of its peers'' (each window holding at least 14 of its 15 readings); its winding temperature rises with it at equal current. While its vibration reading is stuck, on the empty belt: its 15 minute winding mean at least 3 K above the larger of its peers'' and still rising, its 30 minute winding slope 0.5 to 2 K/h above theirs (slower than a gearbox)"},{"code":"gearbox_seizing","description":"a drive gearbox losing oil, which will seize and drag the belt: in the same minute its 30 minute winding slope is at least 2 K/h above the larger of its peers'' (each holding at least 162 of its 180 readings) while its vibration mean is less than 0.05 mm/s above theirs, its vibration reading live (a stuck reading is no quiet vibration); stop the empty belt rather than the drive"},{"code":"transient_none","description":"a rise every drive shares, such as a feed surge"},{"code":"sensor_stuck","description":"the degraded drive''s vibration reading is stuck: its 15 minute readings lie within 0.005 mm/s while each peer''s move by at least 0.02 mm/s, the drive running; its vibration rules cannot be read while it lasts"},{"code":"sensor_lost","description":"the degraded drive''s vibration reading stopped arriving: the fact input_stale.drive3_vibration is true (15 minutes without a reading); its vibration rules cannot be read while it lasts, and the line''s steps rest on its winding"}]'

actions:
  intents:
    - type: install_watch_condition
      risk: R0
      description: Watch until the evidence can tell the cause (the bearing rule or the gearbox rule of the diagnosis catalog holds); its fire wakes the degrading and shedding triggers. Tamoz falls back to it when it recommends nothing.
      parameterSchema:
        type: object
        properties:
          entity_id:
            type: string
          expires_at:
            type: string
          expression:
            type: [string, number]
          max_fires:
            type: integer
          metric:
            type: [string, number]
          situation_id:
            type: string
          situation_version:
            type: integer
          target:
            type: string
          threshold:
            type: number
        additionalProperties: false
      presets:
        default:
          expression: >-
            cel.bind(bearing_vibration_mm_s, 0.3,
            cel.bind(gearbox_slope_k_per_h, 2.0,
            cel.bind(gearbox_quiet_vibration_mm_s, 0.05,
            cel.bind(vibration_readings_15m, 14.0,
            cel.bind(slope_readings_30m, 162.0,
            cel.bind(peer_vibration, features.drive1_vibration_15m > features.drive2_vibration_15m ? features.drive1_vibration_15m : features.drive2_vibration_15m,
            cel.bind(peer_slope, features.drive1_winding_slope_30m > features.drive2_winding_slope_30m ? features.drive1_winding_slope_30m : features.drive2_winding_slope_30m,
            cel.bind(vibration_counted, features.drive1_vibration_readings_15m >= vibration_readings_15m && features.drive2_vibration_readings_15m >= vibration_readings_15m && features.drive3_vibration_readings_15m >= vibration_readings_15m,
            cel.bind(slope_counted, features.drive1_winding_readings_30m >= slope_readings_30m && features.drive2_winding_readings_30m >= slope_readings_30m && features.drive3_winding_readings_30m >= slope_readings_30m,
            cel.bind(bearing_winding_k, 3.0,
            cel.bind(bearing_slope_floor_k_per_h, 0.5,
            cel.bind(winding_readings_15m, 81.0,
            cel.bind(peer_winding, features.drive1_winding_15m > features.drive2_winding_15m ? features.drive1_winding_15m : features.drive2_winding_15m,
            cel.bind(winding_counted, features.drive1_winding_readings_15m >= winding_readings_15m && features.drive2_winding_readings_15m >= winding_readings_15m && features.drive3_winding_readings_15m >= winding_readings_15m,
            cel.bind(lost, (cel.bind(stuck_range_mm_s, 0.005,
            cel.bind(moving_range_mm_s, 0.02,
            cel.bind(drive_running_amps, 1.0,
            cel.bind(vibration_readings_15m, 14.0,
              features.drive3_amps > drive_running_amps &&
              features.drive1_vibration_readings_15m >= vibration_readings_15m && features.drive2_vibration_readings_15m >= vibration_readings_15m && features.drive3_vibration_readings_15m >= vibration_readings_15m &&
              features.drive3_vibration_max_15m - features.drive3_vibration_min_15m < stuck_range_mm_s &&
              features.drive1_vibration_max_15m - features.drive1_vibration_min_15m >= moving_range_mm_s &&
              features.drive2_vibration_max_15m - features.drive2_vibration_min_15m >= moving_range_mm_s)))) ||
              features.input_stale.drive1_vibration || features.input_stale.drive2_vibration || features.input_stale.drive3_vibration),
              !lost && vibration_counted && (features.drive3_vibration_15m - peer_vibration >= bearing_vibration_mm_s ||
                slope_counted && features.drive3_winding_slope_30m - peer_slope >= gearbox_slope_k_per_h && features.drive3_vibration_15m - peer_vibration < gearbox_quiet_vibration_mm_s) ||
              lost && winding_counted && slope_counted && features.drive3_winding_15m - peer_winding >= bearing_winding_k &&
                features.drive3_winding_slope_30m - peer_slope >= bearing_slope_floor_k_per_h && features.drive3_winding_slope_30m - peer_slope < gearbox_slope_k_per_h)))))))))))))))
          max_fires: 3
          metric: drive3_vibration_15m
          threshold: 0.3
      policy: automatic
      rateLimitPerHour: 4
    - type: reduce_feed
      risk: R1
      description: Set the feeder to a preset feed; limp is the feed this plant's two survivors carry (the plant's device catalog sets it), restore the full feed.
      parameterSchema:
        type: object
        properties:
          entity_id:
            type: string
          situation_id:
            type: string
          situation_version:
            type: integer
          level:
            type: string
            enum: [limp, restore]
        required: [level]
        additionalProperties: false
      modelWritableFields: [level]
      presets:
        limp:
          level: limp
        restore:
          level: restore
      policy: automatic
      rateLimitPerHour: 6
    - type: stop_feed
      risk: R2
      description: Stop the feeder so the belt runs empty before a drive or the belt stops.
      parameterSchema:
        type: object
